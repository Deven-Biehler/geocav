[uwsgi]
chdir = /opt/geocav/geocav_proj
module = geocav_proj.wsgi:application
virtualenv = /opt/geocav/geocav_env

#http-socket = 127.0.0.1:8000
socket = 127.0.0.1:8000
protocol = uwsgi

master = true
processes = 4
threads = 2
enable-threads = true
vacuum = true
die-on-term = true

logto = /opt/geocav/log/uwsgi_geocav.log
env = DJANGO_SETTINGS_MODULE=geocav_proj.settings
