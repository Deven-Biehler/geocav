{% extends "base.html" %}
{% load static %}
{% block title %}Geospatial Dashboard | GeoCAV{% endblock %}

{% block content %}
<link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>

<link rel="stylesheet" href="{% static 'styles.css' %}">

<!-- JavaScript Libraries -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://d3js.org/d3-scale-chromatic.v3.min.js"></script>
<script src="https://d3js.org/d3-geo-projection.v2.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>

<div class="title">
    <h2 id="page-title">Choropleth Map with Regression Plot</h2>
</div>
<div class="navigation">
    <h1>Geospatial Dashboard</h1>
</div>
    
    <div class="center-div">
        <div class="map-wrapper">
            <div id="map"></div>
        <div class="filter-box">
            <h3>Filters</h3>
            <div class="filter-content">
                <div class="filter-group">
                    <label for="map-select">Map View:</label>
                    <select id="map-select" name="map-type">
                        <option value="choropleth">Regression Choropleth Map</option>
                        <option value="pie">Pie Chart Map</option>
                        <option value="dotDensity">Heat Map</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="level-select">Geographic Level:</label>
                    <select id="level-select" name="level">
                        <option value="state">State</option>
                        <option value="county">County</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="cancer-select">Cancer Type:</label>
                    <select id="cancer-select" name="cancer-type">
                    </select>
                </div>
                <div class="filter-group">
                    <label for="factor-select">Factor:</label>
                    <select id="factor-select" name="factor" multiple>
                    </select>
                </div>
                <div class="filter-group" id="pc-selection-group">
                    <label for="pc-select">Principal Components:</label>
                    <select id="pc-select" name="pc" multiple>
                    </select>
                </div>
                <div class="filter-group" id="biplot-selection-group">
                    <label>BiPlot Axes:</label>
                    <div class="biplot-selects">
                        <div class="biplot-select">
                            <label for="biplot-x-select">X Axis</label>
                            <select id="biplot-x-select" name="biplot-x">
                            </select>
                        </div>
                        <div class="biplot-select">
                            <label for="biplot-y-select">Y Axis</label>
                            <select id="biplot-y-select" name="biplot-y">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="filter-group button-group">
                    <button id="visualize-btn">Visualize</button>
                    <button id="run-pca-btn">Run PCA</button>
                </div>
                <div class="filter-group">
                    <label for="gender-select">Gender:</label>
                    <select id="gender-select" name="gender">
                        <option value="All">All</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="race-select">Race:</label>
                    <select id="race-select" name="race">
                        <option value="ALL">All</option>
                        <option value="WHITE (INCLUDES HISPANIC)">White (includes Hispanic)</option>
                        <option value="BLACK (INCLUDES HISPANIC)">Black (includes Hispanic)</option>
                        <option value="HISPANIC (ALL RACES)">Hispanic (all races)</option>
                        <option value="ASIAN/PACIFIC ISLANDER (INCLUDES HISPANIC)">Asian/Pacific Islander (includes Hispanic)</option>
                        <option value="AMERICAN INDIAN/ALASKAN NATIVE (INCLUDES HISPANIC)">American Indian/Alaskan Native (includes Hispanic)</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="regression-box">
            <div id="regression-plot"></div>
        </div>
        <div class="legend-box">
            <div id="legend"></div>
        </div>  
        <div class="timeline-box">
            <h3>Cancer Year Selection</h3>
            <select id="cancer-year-selector" name="cancer-year">
            </select>
            <h3>Factor Year Selection</h3>
            <select id="factor-year-selector" name="factor-year">
            </select>

        </div>
    </div>
    <div class="dashboard-bottom">
        <div id="table-container" class="container-fluid"></div>
        <div id="PCA-container-wrapper">
            <div class="pca-view-toggle">
                <button id="toggle-heatmap-btn" class="view-btn active">Loadings Heatmap</button>
                <button id="toggle-biplot-btn" class="view-btn">BiPlot</button>
            </div>
            <div id="PCA-container" class="pca-view active"></div>
            <div id="biplot-container" class="pca-view"></div>
        </div>
    </div>
</div>

    <script type="module" src="{% static 'main.js' %}"></script>
{% endblock %}
