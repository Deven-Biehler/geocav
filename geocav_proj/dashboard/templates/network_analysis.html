{% extends "base.html" %}
{% load static %}
{% block title %}Network Analysis | GMCAV{% endblock %}

{% block content %}

<style>
  /* page-level: no scrollbars */
  html, body { height: 100%; overflow: hidden; }

  .net-wrap {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    height: calc(100vh - 60px);   /* match your base header height */
  }

  .net-controls {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    flex: 0 0 auto;
  }

  .net-controls select, .net-controls button {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    background: #fff;
  }

  /* fixed-width meta so text changes don’t shift layout */
  #netMeta {
    margin-left: auto;
    width: 360px;
    text-align: right;
    font-size: 13px;
    color: #6c757d;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* canvas fills remaining height */
  #netCanvas {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }

  #cy {
    width: 100%;
    height: 100%;
  }
</style>

<div class="net-wrap">
  <h1>Network Analysis</h1>

  <div class="net-controls">
    <label for="networkSelect" style="font-weight:600; margin:0;">Cancer</label>

    <select id="networkSelect" style="min-width: 260px;">
      {% for n in networks %}
        <option value="{{ n.slug }}" {% if n.slug == default_slug %}selected{% endif %}>
          {{ n.label }}
        </option>
      {% endfor %}
    </select>

    <button id="btnDefault" type="button">Display Network</button>
    <button id="btnCluster" type="button">Cluster Network</button>
    <button id="btnDownload" type="button">Download PNG</button>

    <div id="netMeta"></div>
  </div>

  <div id="netCanvas">
    <div id="cy"></div>

    <div id="cy-tooltip"
         style="
           display:none;
           position:absolute;
           z-index:10;
           max-width:360px;
           padding:10px 12px;
           background:rgba(17,24,39,0.92);
           color:#fff;
           border-radius:10px;
           font-size:12px;
           line-height:1.35;
           box-shadow:0 8px 28px rgba(0,0,0,0.22);
           pointer-events:none;
         ">
    </div>
  </div>
</div>


<!-- Cytoscape + layout plugin -->
<script src="https://unpkg.com/cytoscape@3.27.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.min.js"></script>

<script>
(function () {
  const select  = document.getElementById('networkSelect');
  const cyDiv   = document.getElementById('cy');
  const metaEl  = document.getElementById('netMeta');

  let cy = null;

  function showError(html) {
    cyDiv.innerHTML =
      "<div style='padding:14px;color:#842029;background:#f8d7da;border:1px solid #f5c2c7;border-radius:8px;'>" +
      "<strong>Failed to load network.</strong><br><pre style='white-space:pre-wrap;margin:8px 0 0;'>" +
      html +
      "</pre></div>";
    if (metaEl) metaEl.textContent = "";
  }
  function updateMeta(n, m, slug, phase, meta){
    const parts = [`Nodes: ${n}`, `Edges: ${m}`, slug];
    if (phase) parts.push(phase);

    if (meta && meta.clustered && Number.isFinite(meta.n_clusters)) {
      parts.push(`Clusters: ${meta.n_clusters}`);
    }

    if (metaEl) metaEl.textContent = parts.join(" | ");
  }
  function forceRender() {
    if (!cy) return;
    cy.resize(); cy.fit(undefined, 60);
    requestAnimationFrame(() => { cy.resize(); cy.fit(undefined, 60); });
  }

  async function loadNetwork(slug, clustered=false) {
    // Nuke old instance to avoid stale state
    if (cy) { try { cy.destroy(); } catch(e){} cy = null; }
    cyDiv.innerHTML = "";
    if (metaEl) metaEl.textContent = "Loading…";

    const params = new URLSearchParams();
    params.set("t", Date.now());
    if (clustered) {
      params.set("cluster", "1");
      params.set("method", "leiden");  // or make dropdown later
      params.set("res", "1.0");
    }

    const url =
      "{% url 'network_json_by_slug' cancer='__slug__' %}"
        .replace('__slug__', slug) +
      `?cluster=${clustered ? 1 : 0}&t=${Date.now()}`;
    let resp;
    try { resp = await fetch(url, { cache: 'no-store' }); } catch (e) { showError("Request error: " + e); return; }
    if (!resp.ok) { showError(await resp.text()); return; }

    const payload = await resp.json();
    let elements  = payload.elements || [];
    const info    = payload.meta || {};

    // Split nodes/edges, derive nodes if needed
    let nodes = elements.filter(el => el.data && !el.data.source);
    let edges = elements.filter(el => el.data && el.data.source);
    if (!nodes.length && edges.length) {
      const ids = new Set();
      edges.forEach(e => { ids.add(String(e.data.source)); ids.add(String(e.data.target)); });
      nodes = Array.from(ids).map(id => ({ data: { id, label: id } }));
      elements = nodes.concat(edges);
    }

    const N = info.nodes ?? nodes.length;
    const M = info.edges ?? edges.length;

    // Init Cytoscape
    cy = cytoscape({
      container: cyDiv,
      elements,
      style: [
        { selector: 'node',
          style: {
            'background-color': (ele) => {
              const c = ele.data('cluster');
              return (clustered ? clusterColor(c) : '#0d6efd');
            },
            'font-size': 11,
            'min-zoomed-font-size': 10,
            'color': '#212529',
            'text-valign': 'center',
            'text-halign': 'center',
            'border-width': 0.8,          
            'border-color': '#000000',    
            'border-opacity': 1,       
            'width': 14,
            'height': 14
          }
        },
        { selector: 'edge',
          style: {
            'curve-style': 'haystack',              // fastest
            'width': 'mapData(weight, 0, 5, 1, 2)',
            'line-color': '#adb5bd',
            'opacity': 0.55
          }
        },
        { selector: ':selected',
          style: { 'border-width': 2, 'border-color': '#ff6b6b' }
        }
      ],
      textureOnViewport: true,
      pixelRatio: 1,
      wheelSensitivity: 0.25,
      boxSelectionEnabled: true
    });

    const btnDownload = document.getElementById("btnDownload");
    if (btnDownload) {
      btnDownload.onclick = () => {
        if (!cy) return;

        // higher = better resolution (also bigger file)
        const scale = 3; // 2–4 is usually great
        const png64 = cy.png({ full: true, scale, bg: "#ffffff", padding: 120});

        const a = document.createElement("a");
        a.href = png64;
        a.download = `${slug}_${clustered ? "clustered" : "network"}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      };
    }

    // ---- Hover tooltip ----
    const tip = document.getElementById("cy-tooltip");
    const nodeCache = new Map();  // node_id -> payload

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;")
        .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    function renderTipHTML(d){
      const lines = [];
      lines.push(`<div style="font-weight:700;margin-bottom:4px;">${esc(d.node_index)}</div>`);
      const fields = [
        ["Sample_ID", "Tumor_Sample_Barcode"],
        ["Age", "age_at_initial_pathologic_diagnosis"],
        ["Gender", "gender"],
        ["Vital status", "vital_status"],
        ["Race", "race_list"],
        ["Ethnicity", "ethnicity"],
        ["#Mutations", "n_events"],
        ["#Genes", "n_genes"],
        ["Mutations", "event_ids"],
        ["Genes", "genes"]
      ];
      for (const [lab, key] of fields){
        if (d[key] !== undefined && d[key] !== null && String(d[key]).trim() !== ""){
          lines.push(`<div><span style="opacity:.75;">${esc(lab)}:</span> ${esc(d[key])}</div>`);
        }
      }
      return lines.join("");
    }

    function positionTip(evt){
      const p = evt.renderedPosition;
      tip.style.left = `${p.x + 14}px`;
      tip.style.top  = `${p.y + 14}px`;
    }

    function clusterColor(c){
      if (c === null || c === undefined || c < 0) return "#0d6efd";
      const hue = (Number(c) * 47) % 360;
      return `hsl(${hue}, 65%, 50%)`;
    }

    async function fetchNodeMeta(cancerSlug, nodeId){
      const url = `/dashboard/api/network/${encodeURIComponent(cancerSlug)}/node/${encodeURIComponent(nodeId)}.json`;
      const resp = await fetch(url, { cache: "no-store" });
      if (!resp.ok) throw new Error(await resp.text());
      return await resp.json();
    }

    cy.on("mouseover", "node", async (evt) => {
      const nodeId = evt.target.id();          // numeric index from GML
      const slug = select.value;               // your selected cancer type slug

      tip.style.display = "block";
      tip.innerHTML = "<div style='opacity:.75;'>Loading…</div>";
      positionTip(evt);

      try {
        const d = await fetchNodeMeta(slug, nodeId);
        tip.innerHTML = renderTipHTML(d);
      } catch(e) {
        tip.innerHTML = "<div style='color:#ffb3b3;'>No metadata found</div>";
      }
    });

    cy.on("mousemove", "node", (evt) => positionTip(evt));
    cy.on("mouseout", "node", () => { tip.style.display = "none"; tip.innerHTML = ""; });


    // Instant layout so something appears right away
    // Instant layout so something appears right away (ALWAYS run this)
    cy.layout({ name: 'concentric', animate: false, fit: true, padding: 60}).run();
    forceRender();
    updateMeta(N, M, slug, clustered ? "clustered (placed)" : "placed", info);

    // Then run the same fast refine you use today
    const haveFCoSE = !!cy.layouts && typeof cytoscape !== 'undefined' && cytoscape('core', 'fcose') !== undefined;

    if (haveFCoSE) {
      const fcoseOpts = {
        name: 'fcose',
        quality: 'draft',
        animate: false,
        randomize: true,
        nodeSeparation: 60,
        idealEdgeLength: 80,
        linkCrossingFactor: 20,
        packComponents: true,
        samplingType: true,
        nodeRepulsion: 4500,
        fit: true,
        padding: 60
      };

      updateMeta(N, M, slug, clustered ? "clustered (refining)" : "refining (fast)", info);

      const controller = cy.layout(fcoseOpts);
      const timeout = setTimeout(() => {
        try { controller.stop(); } catch(e){}
        cy.fit(); forceRender();
        updateMeta(N, M, slug, clustered ? "clustered" : "ready", info);
      }, 2000);

      controller.on('layoutstop', () => {
        clearTimeout(timeout);
        cy.fit(); forceRender();
        updateMeta(N, M, slug, clustered ? "clustered" : "ready", info);
      });

      controller.run();
      window.addEventListener('resize', forceRender);
      return;
    }

    // Fallback COSE
    const coseController = cy.layout({
      name: 'cose',
      animate: false,
      randomize: true,
      nodeRepulsion: 400000,
      idealEdgeLength: 80,
      gravity: 0.25,
      numIter: 500,
      initialTemp: 1000,
      coolingFactor: 0.99,
      minTemp: 1.0,
      fit: true,
      padding: 60
    });

    const coseTimeout = setTimeout(() => {
      try { coseController.stop(); } catch(e){}
      cy.fit(); forceRender();
      updateMeta(N, M, slug, clustered ? "clustered" : "ready", info);
    }, 1500);

    coseController.on('layoutstop', () => {
      clearTimeout(coseTimeout);
      cy.fit(); forceRender();
      updateMeta(N, M, slug, clustered ? "clustered" : "ready", info);
    });

    coseController.run();
    window.addEventListener('resize', forceRender);

  }

  window.addEventListener('resize', forceRender);

  if (select && select.value) loadNetwork(select.value, false);
  if (select) select.addEventListener('change', e => loadNetwork(e.target.value, false));

  const btnCluster = document.getElementById("btnCluster");
  const btnDefault = document.getElementById("btnDefault");

  if (btnCluster) btnCluster.addEventListener("click", () => {
    if (select && select.value) loadNetwork(select.value, true);
  });

  if (btnDefault) btnDefault.addEventListener("click", () => {
    if (select && select.value) loadNetwork(select.value, false);
  });

})();
</script>

{% endblock %}
