{% extends "base.html" %}

{% block title %}Mutational Landscape{% endblock %}

{% block content %}
<style>
  .land-wrap {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
  }

  .land-controls {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    width: fit-content;
  }

  .land-controls select {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    background: #fff;
  }

  .grid-2x2 {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 14px;
    width: 100%;
  }

  .panel {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 10px;
    min-height: 320px;
    width: 100%;
  }

  .panel h3 {
    margin: 4px 0 8px 0;
    font-size: 16px;
    color: #111827;
  }

  .panel-inner {
    width: 100%;
    height: 260px;
  }

  @media (max-width: 1100px) {
    .grid-2x2 {
      grid-template-columns: 1fr;
    }
  }
</style>

<div class="land-wrap">
  <h1>Mutational Landscape</h1>

  <div class="land-controls">
    <label><strong>Cancer:</strong></label>
    <select id="cancerSelect">
      {% for c in cancers %}
        <option value="{{ c }}" {% if c == selected_cancer %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>

    <label style="margin-left:10px;"><strong>Mutation burden filter:</strong></label>
    <select id="groupBySelect">
      <option value="none">None (overall)</option>
      <option value="gender">Gender</option>
      <option value="stage">Pathologic stage</option>
      <option value="vital_status">Vital status</option>
      <option value="pharma_treatment">Pharma treatment</option>
      <option value="radiation_treatment">Radiation treatment</option>
    </select>

    <label style="margin-left:10px; display:flex; align-items:center; gap:6px;">
    <input type="checkbox" id="showOutliersToggle" checked>
    <strong>Show outliers</strong>
</label>

    <span id="metaText" style="font-size:13px;color:#6b7280;"></span>
  </div>

  <div class="grid-2x2">
    <div class="panel">
      <h3>Variant Type Distribution</h3>
      <div id="variantPlot" class="panel-inner"></div>
    </div>

    <div class="panel">
      <h3>Top Mutated Genes</h3>
      <div id="topGenesPlot" class="panel-inner"></div>
    </div>

    <div class="panel">
      <h3>Mutation Burden (Mutations per Sample)</h3>
      <div id="burdenPlot" class="panel-inner"></div>
    </div>

    <div class="panel">
      <h3>Mutated Gene Count (Unique Genes per Sample)</h3>
      <div id="genesPerSamplePlot" class="panel-inner"></div>
    </div>
  </div>
</div>

<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

<script>
(function(){
  const cancerSelect  = document.getElementById("cancerSelect");
  const groupBySelect = document.getElementById("groupBySelect");
  const showOutliersToggle = document.getElementById("showOutliersToggle");
  const metaText      = document.getElementById("metaText");

  async function fetchLandscape(){
    const cancer  = cancerSelect.value;
    const groupBy = (groupBySelect && groupBySelect.value) ? groupBySelect.value : "none";

    let url = "{% url 'molecular_landscape_json' cancer_name='__C__' %}";
    url = url.replace("__C__", encodeURIComponent(cancer));
    url += `?group_by=${encodeURIComponent(groupBy)}&t=${Date.now()}`;

    metaText.textContent = "Loading…";

    let resp;
    try {
      resp = await fetch(url, {cache: "no-store"});
    } catch (e) {
      console.error(e);
      metaText.textContent = "Failed to load mutational landscape.";
      alert("Failed to load mutational landscape:\n" + e);
      return;
    }

    if (!resp.ok){
      const err = await resp.text();
      console.error(err);
      metaText.textContent = "Failed to load mutational landscape.";
      alert("Failed to load mutational landscape:\n" + err);
      return;
    }

    const data = await resp.json();

    if (!data || !data.meta){
      metaText.textContent = "No data.";
      return;
    }

    const gb = (data.meta.group_by && data.meta.group_by !== "none") ? ` | Grouped by: ${data.meta.group_by}` : "";
    metaText.textContent = `Cancer: ${data.meta.cancer} | Samples: ${data.meta.n_samples}${gb}`;

    renderVariant(data.variant_distribution || {labels: [], counts: []});
    renderTopGenes(data.top_genes || {genes: [], counts: []});
    renderBoxplots(data.burden_box || {groups: [], mutations: [], genes: []});
  }

  // Variant type: horizontal bar, sorted descending in backend; reverse y-axis for top-to-bottom
  function renderVariant(vdata){
    const labels = vdata.labels || [];
    const counts = vdata.counts || [];

    const trace = {
      x: counts,
      y: labels,
      type: "bar",
      orientation: "h"
    };

    const layout = {
      margin: {t: 10, r: 10, b: 40, l: 170},
      xaxis: {title: "Count"},
      yaxis: {title: "Variant classification", autorange: "reversed"},
      height: 260
    };

    Plotly.newPlot("variantPlot", [trace], layout, {responsive:true});
  }

  // Top genes: horizontal bar; reverse y-axis for descending display
  function renderTopGenes(gdata){
    const genes = gdata.genes || [];
    const counts = gdata.counts || [];

    const trace = {
      x: counts,
      y: genes,
      type: "bar",
      orientation: "h"
    };

    const layout = {
      margin: {t: 10, r: 10, b: 40, l: 170},
      xaxis: {title: "Number of samples with mutation"},
      yaxis: {title: "Gene", autorange: "reversed"},
      height: 260
    };

    Plotly.newPlot("topGenesPlot", [trace], layout, {responsive:true});
  }

  function removeOutliersIQR(values) {
    const arr = (values || []).filter(v => typeof v === "number" && !isNaN(v));
    if (arr.length < 8) return arr;

    const sorted = [...arr].sort((a, b) => a - b);
    const q1 = sorted[Math.floor(sorted.length * 0.25)];
    const q3 = sorted[Math.floor(sorted.length * 0.75)];
    const iqr = q3 - q1;

    const lower = q1 - 1.5 * iqr;
    const upper = q3 + 1.5 * iqr;

    return arr.filter(v => v >= lower && v <= upper);
  }

  // Boxplots for mutation burden + mutated gene count (separate plots)
  function renderBoxplots(bbox){
    const groups = bbox.groups || [];

    const showOutliers = showOutliersToggle ? showOutliersToggle.checked : true;
    const boxpointsVal = showOutliers ? "outliers" : false;

    function maybeTrim(values){
      return showOutliers ? (values || []) : removeOutliersIQR(values || []);
    }

    // ---- mutations per sample ----
    const mutsByGroup = bbox.mutations || [];
    const mutTraces = groups.map((g, i) => ({
      y: maybeTrim(mutsByGroup[i]),
      type: "box",
      name: g,
      boxpoints: boxpointsVal, // ✅ toggle here
      jitter: 0.3,
      pointpos: 0
    }));

    Plotly.newPlot("burdenPlot", mutTraces, {
      margin: {t: 10, r: 10, b: 70, l: 60},
      yaxis: {title: "Mutations per sample"},
      xaxis: {tickangle: -25},
      height: 260,
      boxmode: "group"
    }, {responsive:true});

    // ---- unique genes per sample ----
    const genesByGroup = bbox.genes || [];
    const geneTraces = groups.map((g, i) => ({
      y: maybeTrim(genesByGroup[i]),
      type: "box",
      name: g,
      boxpoints: boxpointsVal, // ✅ toggle here too
      jitter: 0.3,
      pointpos: 0
    }));

    Plotly.newPlot("genesPerSamplePlot", geneTraces, {
      margin: {t: 10, r: 10, b: 70, l: 60},
      yaxis: {title: "Unique mutated genes per sample"},
      xaxis: {tickangle: -25},
      height: 260,
      boxmode: "group"
    }, {responsive:true});
  }


  // events
  cancerSelect.addEventListener("change", fetchLandscape);
  if (groupBySelect) groupBySelect.addEventListener("change", fetchLandscape);
  if (showOutliersToggle) showOutliersToggle.addEventListener("change", fetchLandscape);

  // initial load
  if (cancerSelect.value){
    fetchLandscape();
  }
})();
</script>
{% endblock %}
