{% extends "base.html" %}

{% block title %}{{ guide_title }}{% endblock %}

{% block content %}

<style>
  .guide-page {
    max-width: 950px;
    margin: 0 auto;
  }

  .guide-back {
    display: inline-block;
    margin-bottom: 18px;
    text-decoration: none;
    font-size: 14px;
  }

  .guide-content {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 30px 36px;
    line-height: 1.7;
  }

  .guide-content h1 {
    margin-top: 0;
    font-size: 30px;
  }

  .guide-content h2 {
    margin-top: 32px;
    padding-bottom: 6px;
    border-bottom: 1px solid #e5e7eb;
  }

  .guide-content h3 {
    margin-top: 24px;
  }

  .guide-content p {
    color: #374151;
  }

  .guide-content li {
    margin-bottom: 6px;
  }

  .guide-content code {
    background: #f3f4f6;
    padding: 2px 5px;
    border-radius: 4px;
  }

  .guide-content pre {
    background: #f3f4f6;
    padding: 14px;
    border-radius: 7px;
    overflow-x: auto;
  }

  .guide-content table {
    border-collapse: collapse;
    width: 100%;
    margin: 18px 0;
  }

  .guide-content th,
  .guide-content td {
    border: 1px solid #d1d5db;
    padding: 8px 10px;
    text-align: left;
  }

  .guide-content img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
  }

  @media (max-width: 700px) {
    .guide-content {
      padding: 20px;
    }
  }
</style>


<div class="guide-page">

  <a href="{% url 'guides' %}" class="guide-back">
    ← Back to Guides
  </a>

  <article class="guide-content">
    {{ guide_content|safe }}
  </article>

</div>

{% endblock %}
